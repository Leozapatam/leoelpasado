<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grabadora · @leoelpasado</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Special+Elite&display=swap" rel="stylesheet" />
<style>
  :root { --ink:#0d0b09; --paper:#f4ead5; --muted:#a8977c; --red:#c1121f; --panel:#1a1511; }
  * { box-sizing: border-box; }
  body { margin:0; background:radial-gradient(circle at 50% 0%, #241b13, var(--ink) 70%); color:var(--paper);
         font-family:"Special Elite", monospace; min-height:100vh; }
  header { padding:20px 24px 8px; display:flex; align-items:baseline; gap:14px; flex-wrap:wrap; }
  h1 { font-family:"Playfair Display", serif; font-weight:900; font-size:28px; margin:0; }
  header span { color:var(--red); letter-spacing:3px; font-size:13px; }
  main { display:grid; grid-template-columns: minmax(260px, 380px) 1fr; gap:20px; padding:12px 24px 24px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .stage { position:relative; aspect-ratio:9/16; background:#000; border:1px solid #3a2e22; border-radius:10px; overflow:hidden; }
  .stage video { width:100%; height:100%; object-fit:cover; transform:scaleX(-1); }
  .stage .mic { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; color:var(--muted); }
  .meter { width:70%; height:10px; background:#2a2119; border-radius:5px; overflow:hidden; }
  .meter i { display:block; height:100%; width:0; background:var(--red); transition:width .05s; }
  .count { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
           font-family:"Playfair Display"; font-size:140px; background:rgba(0,0,0,.55); }
  .rec { position:absolute; top:12px; left:12px; display:none; align-items:center; gap:8px; font-size:14px; }
  .rec::before { content:""; width:12px; height:12px; border-radius:50%; background:var(--red); animation:b 1s infinite; }
  @keyframes b { 50% { opacity:.2 } }
  .controls { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; }
  button, select { font-family:inherit; font-size:15px; padding:10px 16px; border-radius:6px; border:1px solid #4a3b2c;
           background:var(--panel); color:var(--paper); cursor:pointer; }
  button.primary { background:var(--red); border-color:var(--red); }
  button:disabled { opacity:.4; cursor:default; }
  .prompter { background:var(--panel); border:1px solid #3a2e22; border-radius:10px; height:calc(100vh - 140px); min-height:420px;
              overflow:hidden; position:relative; }
  .prompter .text { padding:40vh 36px; font-family:"Playfair Display", serif; font-weight:700; font-size:var(--fs, 40px);
              line-height:1.45; white-space:pre-wrap; }
  .prompter::after { content:""; position:absolute; left:0; right:0; top:38%; height:3px; background:rgba(193,18,31,.5); }
  .prompter .text em.tag { display:block; font-family:"Special Elite"; font-style:normal; font-size:16px; color:var(--red); letter-spacing:2px; }
  .row { display:flex; align-items:center; gap:10px; margin-top:10px; color:var(--muted); font-size:13px; flex-wrap:wrap; }
  .takes { margin-top:16px; display:flex; flex-direction:column; gap:10px; }
  .take { background:var(--panel); border:1px solid #3a2e22; border-radius:8px; padding:10px; font-size:13px; }
  .take video, .take audio { width:100%; margin-top:6px; max-height:260px; }
  .ok { color:#7fd18b; }
  .err { color:#ff6b6b; }
</style>
</head>
<body>
<header>
  <h1>Grabadora</h1><span>@LEOELPASADO · NINGÚN HILO SIN FUENTE</span>
</header>
<main>
  <section>
    <div class="stage" id="stage">
      <video id="cam" autoplay muted playsinline hidden></video>
      <div class="mic" id="micview">
        <div>🎙️ Modo voz</div>
        <div class="meter"><i id="lvl"></i></div>
      </div>
      <div class="rec" id="rec">REC <b id="t">0:00</b></div>
      <div class="count" id="count"></div>
    </div>
    <div class="controls">
      <select id="mode">
        <option value="voz">Solo voz</option>
        <option value="video">Video + voz</option>
      </select>
      <button id="start" class="primary">● Grabar</button>
      <button id="stop" disabled>■ Parar</button>
    </div>
    <div class="row" id="status">Elige el modo y pulsa Grabar. El navegador te pedirá permiso de micrófono/cámara.</div>
    <div class="takes" id="takes"></div>
  </section>
  <section>
    <div class="prompter" id="prompter"><div class="text" id="text">Cargando guion…</div></div>
    <div class="row">
      Teleprompter:
      <button id="pslower">− lento</button><b id="speed">1.0×</b><button id="pfaster">+ rápido</button>
      <button id="psmaller">A−</button><button id="pbigger">A+</button>
      <button id="preset">↺ inicio</button>
      <span>(avanza solo mientras grabas; rueda del ratón para mover)</span>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
let stream, recorder, chunks = [], t0, timer, audioCtx, raf;
let speed = 1, fs = 40, scrollY = 0, scrolling = false;

// ---------- Guion ----------
fetch("/guion").then(r => r.text()).then(md => {
  const body = md.split("---")[1] || md;
  const html = body.trim()
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/\*\*\[(.+?)\]\*\*/g, '<em class="tag">$1</em>')
    .replace(/\*(.+?)\*/g, "<i>$1</i>");
  $("text").innerHTML = html;
}).catch(() => { $("text").textContent = "No pude cargar el guion."; });

const applyScroll = () => { $("text").style.transform = `translateY(${-scrollY}px)`; };
$("prompter").addEventListener("wheel", (e) => { scrollY = Math.max(0, scrollY + e.deltaY * 0.5); applyScroll(); e.preventDefault(); }, { passive:false });
$("pslower").onclick = () => { speed = Math.max(0.3, +(speed - 0.1).toFixed(1)); $("speed").textContent = speed.toFixed(1) + "×"; };
$("pfaster").onclick = () => { speed = Math.min(3, +(speed + 0.1).toFixed(1)); $("speed").textContent = speed.toFixed(1) + "×"; };
$("psmaller").onclick = () => { fs = Math.max(22, fs - 4); $("text").style.setProperty("--fs", fs + "px"); };
$("pbigger").onclick = () => { fs = Math.min(80, fs + 4); $("text").style.setProperty("--fs", fs + "px"); };
$("preset").onclick = () => { scrollY = 0; applyScroll(); };
let last = performance.now();
(function tick(now) {
  if (scrolling) { scrollY += (now - last) * 0.045 * speed; applyScroll(); }
  last = now; requestAnimationFrame(tick);
})(last);

// ---------- Medios ----------
async function getStream(mode) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  stream = await navigator.mediaDevices.getUserMedia(
    mode === "video" ? { audio, video: { width: { ideal: 1920 }, height: { ideal: 1080 }, frameRate: { ideal: 30 } } } : { audio }
  );
  $("cam").hidden = mode !== "video";
  $("micview").style.display = mode === "video" ? "none" : "flex";
  if (mode === "video") $("cam").srcObject = stream;
  meter();
}

function meter() {
  cancelAnimationFrame(raf);
  audioCtx?.close();
  audioCtx = new AudioContext();
  const an = audioCtx.createAnalyser();
  audioCtx.createMediaStreamSource(stream).connect(an);
  const d = new Uint8Array(an.fftSize);
  const loop = () => {
    an.getByteTimeDomainData(d);
    let peak = 0; for (const v of d) peak = Math.max(peak, Math.abs(v - 128));
    $("lvl").style.width = Math.min(100, peak / 1.28) + "%";
    raf = requestAnimationFrame(loop);
  };
  loop();
}

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const status = (msg, cls = "") => { $("status").className = "row " + cls; $("status").textContent = msg; };

$("start").onclick = async () => {
  const mode = $("mode").value;
  try { await getStream(mode); }
  catch (e) { status("Sin acceso al " + (mode === "video" ? "micrófono/cámara" : "micrófono") + ": " + e.message, "err"); return; }
  $("start").disabled = true; $("mode").disabled = true;
  for (const n of [3, 2, 1]) { $("count").style.display = "flex"; $("count").textContent = n; await sleep(800); }
  $("count").style.display = "none";
  const mime = mode === "video"
    ? (MediaRecorder.isTypeSupported("video/webm;codecs=vp9,opus") ? "video/webm;codecs=vp9,opus" : "video/webm")
    : "audio/webm;codecs=opus";
  recorder = new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 192000, videoBitsPerSecond: 8000000 });
  chunks = [];
  recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
  recorder.onstop = () => save(mode, new Blob(chunks, { type: mime }));
  recorder.start(1000);
  t0 = Date.now(); scrolling = true;
  $("rec").style.display = "flex"; $("stop").disabled = false;
  status("Grabando… lee con calma.");
  timer = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("t").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }, 250);
};

$("stop").onclick = () => {
  recorder?.stop(); clearInterval(timer); scrolling = false;
  $("rec").style.display = "none"; $("stop").disabled = true;
  $("start").disabled = false; $("mode").disabled = false;
};

async function save(mode, blob) {
  const url = URL.createObjectURL(blob);
  const box = document.createElement("div");
  box.className = "take";
  box.innerHTML = `<div>Toma ${mode} · ${(blob.size / 1e6).toFixed(1)} MB · <span>guardando…</span></div>`;
  const media = document.createElement(mode === "video" ? "video" : "audio");
  media.controls = true; media.src = url; box.appendChild(media);
  $("takes").prepend(box);
  const label = box.querySelector("span");
  try {
    const r = await fetch("/upload?kind=" + mode, { method: "POST", body: blob });
    const j = await r.json();
    label.className = "ok"; label.textContent = "guardada como " + j.name;
    status("Listo. Dile a Claude: «ya grabé».", "ok");
  } catch (e) {
    label.className = "err"; label.textContent = "no se pudo guardar (" + e.message + ")";
  }
}
</script>
</body>
</html>
